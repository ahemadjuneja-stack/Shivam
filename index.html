<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
(function () {
  if (window.__TD) return;
  var TD = window.__TD = { log: [], t0: Date.now() };
  var WATCH = { touchstart:1, touchmove:1, touchend:1, touchcancel:1, pointerdown:1, pointermove:1, pointercancel:1, contextmenu:1, dragstart:1 };
  var MAX = 160;
  function ts(){ return ((Date.now()-TD.t0)/1000).toFixed(1); }
  function desc(el){
    if(!el||!el.tagName) return String(el);
    var s=el.tagName.toLowerCase();
    if(el.className && typeof el.className==='string'){ s+='.'+el.className.trim().split(/\s+/).slice(0,3).join('.'); }
    return s;
  }
  function stack(){
    try{
      var lines=new Error().stack.split('\n').filter(function(l){ return l.indexOf('__TD')===-1; });
      return lines.slice(2,5).map(function(l){ return l.trim().replace(/^at /,'').slice(0,90); }).join(' <- ');
    }catch(e){ return ''; }
  }
  function add(txt,color){ TD.log.push({t:ts(),txt:txt,color:color||'#4ade80'}); if(TD.log.length>MAX)TD.log.shift(); render(); }
  function findScroller(el){
    while(el && el!==document.documentElement){
      if(el.nodeType===1){
        var cs=getComputedStyle(el);
        if((cs.overflowY==='auto'||cs.overflowY==='scroll') && el.scrollHeight>el.clientHeight+2) return el;
      }
      el=el.parentElement;
    }
    return null;
  }
  var origAdd = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function(type,fn,opts){
    try{
      if(WATCH[type]){
        var passive = opts && typeof opts==='object' ? !!opts.passive : (opts===true);
        add('REG '+type+' on '+desc(this)+' passive='+passive+(passive?'':'  ⚠NONPASSIVE'), passive?'#4ade80':'#f87171');
        if(!passive) add('   at '+stack(),'#fbbf24');
      }
    }catch(e){}
    return origAdd.call(this,type,fn,opts);
  };
  var origPD = Event.prototype.preventDefault;
  Event.prototype.preventDefault = function(){
    try{ if(WATCH[this.type]){ add('⛔ preventDefault on '+this.type+' target='+desc(this.target),'#f87171'); add('   at '+stack(),'#fbbf24'); } }catch(e){}
    return origPD.call(this);
  };
  var origSPC = Element.prototype.setPointerCapture;
  Element.prototype.setPointerCapture = function(pid){
    try{ add('🔒 setPointerCapture('+pid+') on '+desc(this),'#a78bfa'); add('   at '+stack(),'#fbbf24'); }catch(e){}
    return origSPC.call(this,pid);
  };
  var curScroller = null;
  origAdd.call(document,'touchstart',function(e){
    var t=e.target;
    curScroller=findScroller(t);
    add('▶ touchstart '+desc(t),'#60a5fa');
    add('   scroller: '+(curScroller?(desc(curScroller)+' st='+curScroller.scrollTop):'NONE'),'#fbbf24');
  },{capture:true,passive:true});
  origAdd.call(document,'touchmove',function(e){
    TD.moves=(TD.moves||0)+1;
    if(TD.moves%10===0){ add('… x'+TD.moves+' cancelable='+(e.cancelable?1:0),'#94a3b8'); }
  },{capture:true,passive:true});
  origAdd.call(document,'touchend',function(){
    add('■ touchend scroller st='+(curScroller?curScroller.scrollTop:'?'),'#60a5fa');
  },{capture:true,passive:true});
  origAdd.call(document,'pointercancel',function(e){ add('❌ pointercancel target='+desc(e.target),'#f87171'); },{capture:true,passive:true});
  origAdd.call(document,'touchcancel',function(e){ add('❌ touchcancel target='+desc(e.target),'#f87171'); },{capture:true,passive:true});
  origAdd.call(document,'contextmenu',function(e){ add('🧭 contextmenu '+desc(e.target)+(e.defaultPrevented?' (prevented OK)':' (NOT prevented ⚠)'),'#a78bfa'); },{capture:true,passive:true});
  function el(tag,css,txt){ var d=document.createElement(tag); d.style.cssText=css; if(txt)d.textContent=txt; return d; }
  var box=el('div','position:fixed;left:6px;bottom:6px;width:62vw;max-width:340px;z-index:2147483647;font:10px/1.35 monospace;background:rgba(0,0,0,.92);border:1px solid #f87171;border-radius:8px;padding:6px;color:#4ade80;');
  var head=el('div','display:flex;gap:6px;align-items:center;margin-bottom:4px;');
  var title=el('b','color:#f87171;flex:1;','🐞 TOUCH DEBUG v2');
  var btnMin=el('button','background:#f87171;color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:10px;','–');
  var btnClear=el('button','background:#334155;color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:10px;','CLEAR');
  var btnCopy=el('button','background:#16a34a;color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:10px;','COPY');
  var view=el('div','max-height:34vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word;');
  head.appendChild(title); head.appendChild(btnMin); head.appendChild(btnClear); head.appendChild(btnCopy);
  box.appendChild(head); box.appendChild(view); document.documentElement.appendChild(box);
  var open=true;
  btnMin.onclick=function(){ open=!open; view.style.display=open?'block':'none'; btnMin.textContent=open?'–':'+'; };
  btnClear.onclick=function(){ TD.log=[]; render(); };
  btnCopy.onclick=function(){
    var txt=TD.log.map(function(l){ return '['+l.t+'] '+l.txt; }).join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); }
    else{ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    btnCopy.textContent='COPIED ✓'; setTimeout(function(){ btnCopy.textContent='COPY'; },1200);
  };
  function render(){
    view.innerHTML='';
    TD.log.slice(-40).forEach(function(l){
      var d=document.createElement('div');
      d.style.color=l.color; d.textContent='['+l.t+'] '+l.txt;
      view.appendChild(d);
    });
    view.scrollTop=view.scrollHeight;
  }
  add('TouchDebug v2 ready','#f87171');
})();
</script>
